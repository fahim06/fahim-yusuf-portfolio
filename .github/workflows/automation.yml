name: Repository Automation & Release

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ── 1. Pull Request Auto-Labeler & Quality Gate ──────────────────────────────
  pr-automation:
    name: PR Classification & Size Labeler
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze PR Size & Add Label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const totalChanges = files.reduce((acc, file) => acc + file.changes, 0);
            let sizeLabel = 'size/xs';
            if (totalChanges > 500) sizeLabel = 'size/xl';
            else if (totalChanges > 200) sizeLabel = 'size/l';
            else if (totalChanges > 80) sizeLabel = 'size/m';
            else if (totalChanges > 20) sizeLabel = 'size/s';

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [sizeLabel]
              });
            } catch (err) {
              console.log('Notice: Could not attach label (may require label creation permissions):', err.message);
            }

  # ── 2. Automatic Release Generation on Git Tags ──────────────────────────────
  create-release:
    name: Automatic GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

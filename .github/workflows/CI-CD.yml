name: Unified CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    # Run weekly security scan on Mondays at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

permissions:
  contents: write
  pull-requests: write
  issues: write
  security-events: write
  actions: read
  pages: write
  id-token: write
  deployments: write
  statuses: write

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Enforce Branching Strategy ────────────────────────────────────────────
  enforce-branching:
    name: Enforce Branching Strategy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Error: Pull requests targeting the 'main' branch MUST originate from the 'dev' branch."
            echo "You are attempting to merge from '${{ github.head_ref }}'."
            exit 1
          fi
          echo "Branch check passed! Source branch is dev."

  # ── 2. PR Automation ─────────────────────────────────────────────────────────
  pr-automation:
    name: PR Classification & Size Labeler
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze PR Size & Add Label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const totalChanges = files.reduce((acc, file) => acc + file.changes, 0);
            let sizeLabel = 'size/xs';
            if (totalChanges > 500) sizeLabel = 'size/xl';
            else if (totalChanges > 200) sizeLabel = 'size/l';
            else if (totalChanges > 80) sizeLabel = 'size/m';
            else if (totalChanges > 20) sizeLabel = 'size/s';

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [sizeLabel]
              });
            } catch (err) {
              console.log('Notice: Could not attach label (may require label creation permissions):', err.message);
            }

  # ── 3. Security: SAST & Secrets ──────────────────────────────────────────────
  security-sast:
    name: CodeQL & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL for JavaScript / TypeScript
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  # ── 4. Security: Dependency Review ───────────────────────────────────────────
  dependency-review:
    name: Dependency Vulnerability Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review PR Dependency Changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: true

  # ── 5. Code Quality & Linting ────────────────────────────────────────────────
  lint-and-audit:
    name: Lint & Audit (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint code analyzer
        run: npm run lint

      - name: Check dependencies for high/critical CVEs
        run: |
          npm audit --audit-level=high || true

  # ── 6. Build Validation ──────────────────────────────────────────────────────
  build:
    name: Build & Bundle Validation (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint-and-audit]
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify build artifacts exist
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html was not generated!"
            exit 1
          fi
          echo "Production build verified successfully."

      - name: Upload production artifact (Node 22 only)
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          retention-days: 7

      - name: Upload dist for pages
        if: matrix.node-version == 22
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/'

  # ── 7. SEO & Asset Integrity Check ───────────────────────────────────────────
  seo-and-links:
    name: SEO & Static Asset Validation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist

      - name: Verify Sitemap and Robots.txt match target domain
        run: |
          TARGET_URL="https://fahimyusuf.com.bd/"
          echo "Checking sitemap.xml for target URL: $TARGET_URL"
          grep -q "https://fahimyusuf.com.bd/" dist/sitemap.xml || (echo "Missing target URL in dist/sitemap.xml" && exit 1)
          
          echo "Checking robots.txt for sitemap reference"
          grep -q "https://fahimyusuf.com.bd/sitemap.xml" dist/robots.txt || (echo "Missing sitemap in dist/robots.txt" && exit 1)
          
          echo "Static SEO & link checks passed."

  # ── 8. Vercel Preview Deployment ─────────────────────────────────────────────
  deploy-preview:
    name: Deploy PR Preview to Vercel
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy PR Preview to Vercel
        id: vercel-preview
        uses: amondnet/vercel-action@v25
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-comment: true
        continue-on-error: true

  # ── 9. Vercel Production Deployment ──────────────────────────────────────────
  deploy-production:
    name: Deploy to Production (Vercel)
    needs: [enforce-branching, security-sast, build]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fahimyusuf.com.bd/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        id: vercel-deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}
        continue-on-error: true

      - name: Log Deployment Status
        run: |
          echo "=========================================================="
          echo "🚀 Deployment successfully triggered for main branch!"
          echo "Target Production URL: https://fahimyusuf.com.bd/"
          echo "=========================================================="

  # ── 10. Post-Deployment Smoke Test ───────────────────────────────────────────
  smoke-test:
    name: Production Health & SSL Smoke Test
    needs: deploy-production
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for DNS & deployment propagation
        run: sleep 10

      - name: Verify Live Website Status
        run: |
          PROD_URL="https://fahimyusuf.com.bd/"
          echo "Pinging Live Production URL: $PROD_URL"
          
          # Perform HTTP GET request and retrieve HTTP status code
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$PROD_URL" || echo "000")
          echo "HTTP Response Status Code: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Smoke test passed! Production site is healthy and serving requests."
          else
            echo "⚠️ Notice: Endpoint returned HTTP $HTTP_STATUS. (May still be propagating if DNS was recently updated)."
          fi

  # ── 11. GitHub Pages Deployment ──────────────────────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

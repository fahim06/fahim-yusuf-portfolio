name: 🚀 Portfolio CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read

concurrency:
  group: portfolio-cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PROD_URL: 'https://fahimyusuf.com.bd/'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # ① CODE QUALITY & SECURITY
  # GitHub renders this as a compact matrix group with five checks.
  # ═══════════════════════════════════════════════════════════════════════════════
  quality-security:
    name: ① Quality & Security • 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: branching
            label: Branching Strategy
          - id: pr
            label: PR Classification & Size
          - id: sast
            label: CodeQL & Secret Scanner
          - id: dependencies
            label: Dependency Vulnerability
          - id: lint
            label: Lint & Audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.id == 'sast' && 0 || 1 }}

      # ── Branching strategy ────────────────────────────────────────────────────
      - name: Validate PR source branch
        if: matrix.id == 'branching' && github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_BRANCH" != "dev" ]]; then
            echo "::error::Pull requests into main must originate from dev."
            echo "Detected source branch: $HEAD_BRANCH"
            exit 1
          fi
          echo "✅ Branching strategy passed: dev → main"

      - name: Validate main commit came through dev PR
        if: >
          matrix.id == 'branching' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.sha;
            const prs = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
                per_page: 100
              }
            );

            const valid = prs.find(pr =>
              pr.state === 'closed' &&
              pr.merged_at &&
              pr.base.ref === 'main' &&
              pr.head.ref === 'dev'
            );

            if (!valid) {
              core.setFailed(
                `Commit ${sha} is not associated with a merged dev → main PR. Direct commits to main are blocked.`
              );
              return;
            }

            core.notice(`✅ Branching strategy passed via PR #${valid.number}: dev → main`);

      - name: Branching check not applicable
        if: >
          matrix.id == 'branching' &&
          !(
            (github.event_name == 'pull_request' && github.base_ref == 'main') ||
            (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
          )
        run: echo "ℹ️ Branching enforcement is only required for PRs into main and main releases."

      # ── PR classification + size ──────────────────────────────────────────────
      - name: Classify PR and calculate size
        if: >
          matrix.id == 'pr' &&
          (github.event_name == 'pull_request' ||
           (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
        uses: actions/github-script@v9
        with:
          script: |
            const sizeLabels = ['size/xs', 'size/s', 'size/m', 'size/l', 'size/xl'];
            const typeLabels = [
              'type/feat', 'type/fix', 'type/refactor', 'type/docs',
              'type/test', 'type/chore', 'type/perf', 'type/ci', 'type/build', 'type/style'
            ];

            async function ensureLabel(name) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color: '6B7280'
                });
              }
            }

            let pr;

            if (context.eventName === 'pull_request') {
              pr = context.payload.pull_request;
            } else {
              const prs = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: context.sha,
                  per_page: 100
                }
              );

              pr = prs.find(item =>
                item.state === 'closed' &&
                item.merged_at &&
                item.base.ref === 'main' &&
                item.head.ref === 'dev'
              );

              if (!pr) {
                core.setFailed(`No merged dev → main PR is associated with commit ${context.sha}.`);
                return;
              }
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const totalChanges = files.reduce(
              (sum, file) => sum + (file.additions || 0) + (file.deletions || 0),
              0
            );

            let size = 'xs';
            if (totalChanges > 500) size = 'xl';
            else if (totalChanges > 200) size = 'l';
            else if (totalChanges > 80) size = 'm';
            else if (totalChanges > 20) size = 's';

            const conventional = pr.title.trim().match(
              /^(feat|fix|refactor|docs|test|chore|perf|ci|build|style)(\([^)]+\))?!?:/i
            );

            const typeMap = {
              feat: 'type/feat',
              fix: 'type/fix',
              refactor: 'type/refactor',
              docs: 'type/docs',
              test: 'type/test',
              chore: 'type/chore',
              perf: 'type/perf',
              ci: 'type/ci',
              build: 'type/build',
              style: 'type/style'
            };

            const typeLabel = conventional
              ? typeMap[conventional[1].toLowerCase()]
              : 'type/chore';

            try {
              for (const label of [...sizeLabels, ...typeLabels]) {
                await ensureLabel(label);
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    name: label
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [`size/${size}`, typeLabel]
              });
            } catch (error) {
              core.warning(`Classification completed, but labels could not be updated: ${error.message}`);
            }

            await core.summary
              .addHeading('🏷️ PR Classification')
              .addTable([
                [{data: 'Metric', header: true}, {data: 'Result', header: true}],
                ['PR', `#${pr.number}`],
                ['Type', typeLabel.replace('type/', '')],
                ['Size', `size/${size}`],
                ['Changed lines', String(totalChanges)],
                ['Files changed', String(files.length)]
              ])
              .write();

      - name: PR classification not applicable
        if: >
          matrix.id == 'pr' &&
          !(github.event_name == 'pull_request' ||
            (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
        run: echo "ℹ️ PR classification is not applicable to this event."

      # ── CodeQL + secret scanner ────────────────────────────────────────────────
      - name: Initialize CodeQL
        if: matrix.id == 'sast'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Analyze with CodeQL
        if: matrix.id == 'sast'
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

      - name: Run Gitleaks secret scanner
        if: matrix.id == 'sast'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Dependency vulnerability ───────────────────────────────────────────────
      - name: Setup Node.js for dependency checks
        if: matrix.id == 'dependencies'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install exact dependencies
        if: matrix.id == 'dependencies'
        run: npm ci

      - name: Review dependency changes
        if: matrix.id == 'dependencies' && github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: false
          show-patched-versions: true

      - name: Audit all dependencies
        if: matrix.id == 'dependencies' && github.event_name != 'pull_request'
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        if: matrix.id == 'dependencies'
        run: npm audit --omit=dev --audit-level=high

      # ── Lint & audit ───────────────────────────────────────────────────────────
      - name: Setup Node.js for lint
        if: matrix.id == 'lint'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies for lint
        if: matrix.id == 'lint'
        run: npm ci

      - name: Run lint
        if: matrix.id == 'lint'
        run: npm run lint

      - name: Run blocking npm audit
        if: matrix.id == 'lint'
        run: npm audit --audit-level=high

  # ═══════════════════════════════════════════════════════════════════════════════
  # ② BUILD & VALIDATE
  # Matrix is intentionally used so GitHub groups Node 22/24 into one stage card.
  # Node 24 additionally performs SEO/static validation and publishes artifacts.
  # ═══════════════════════════════════════════════════════════════════════════════
  build-validate:
    name: ② Build & Validate • Node ${{ matrix.node-version }}
    needs: quality-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -s dist/index.html
          echo "✅ Production bundle exists and is non-empty."

      - name: Validate SEO metadata and static files
        if: matrix.node-version == 24
        env:
          TARGET_URL: ${{ env.PROD_URL }}
        run: |
          set -euo pipefail

          test -s dist/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml

          grep -Fq "$TARGET_URL" dist/sitemap.xml
          grep -Fq "Sitemap: ${TARGET_URL}sitemap.xml" dist/robots.txt

          python3 <<'PY'
          import re
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote

          root = Path('dist')
          html = (root / 'index.html').read_text(encoding='utf-8', errors='ignore')

          assert re.search(r'<title>\s*[^<]+\s*</title>', html, re.I), 'Missing non-empty <title>.'

          desc = re.search(
              r'<meta\b[^>]*\bname=["\']description["\'][^>]*\bcontent=["\'][^"\']+["\']',
              html,
              re.I,
          )
          desc = desc or re.search(
              r'<meta\b[^>]*\bcontent=["\'][^"\']+["\'][^>]*\bname=["\']description["\']',
              html,
              re.I,
          )
          assert desc, 'Missing non-empty meta description.'

          class AssetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag in {'script', 'img', 'source', 'video', 'audio', 'iframe'}:
                      value = attrs.get('src')
                  elif tag == 'link':
                      value = attrs.get('href')
                  else:
                      value = None
                  if value:
                      self.refs.append(value)

          parser = AssetParser()
          parser.feed(html)

          missing = []
          for ref in sorted(set(parser.refs)):
              parsed = urlparse(ref)
              if parsed.scheme in {'http', 'https', 'mailto', 'tel'}:
                  continue
              path = unquote(parsed.path)
              if not path or path.startswith('#') or path.endswith('/'):
                  continue
              candidate = (root / path.lstrip('/')).resolve()
              if not candidate.is_file():
                  missing.append(ref)

          if missing:
              print('Missing local assets:')
              print('\n'.join(missing))
              raise SystemExit(1)

          print(f'✅ SEO metadata and {len(set(parser.refs))} asset references validated.')
          PY

      - name: Upload production artifact
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v7
        with:
          name: production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: matrix.node-version == 24
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  # ═══════════════════════════════════════════════════════════════════════════════
  # ③ DEPLOYMENTS
  # Three parallel deployment cards after all quality/build gates pass.
  # ═══════════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: ③ Deployments • Production (Vercel)
    needs: build-validate
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.PROD_URL }}
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::Missing VERCEL_TOKEN secret."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Missing VERCEL_PROJECT_ID secret."; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Authenticate Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel whoami --token="$VERCEL_TOKEN"

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          rm -rf .vercel
          vercel link --yes --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Production deployment summary
        run: |
          {
            echo "## 🚀 Production Deployment"
            echo
            echo "✅ Vercel production deployment completed."
            echo "🌐 ${PROD_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-preview:
    name: ③ Deployments • Vercel Preview
    needs: build-validate
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.event.inputs.environment == 'preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::Missing VERCEL_TOKEN secret."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Missing VERCEL_PROJECT_ID secret."; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Authenticate Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel whoami --token="$VERCEL_TOKEN"

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          rm -rf .vercel
          vercel link --yes --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOY_OUTPUT="$(vercel deploy --yes --token="$VERCEL_TOKEN" 2>&1)"
          printf '%s\n' "$DEPLOY_OUTPUT"

          PREVIEW_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1 || true)"
          if [[ -z "$PREVIEW_URL" ]]; then
            echo "::error::Preview deployment completed but no Vercel URL was detected."
            exit 1
          fi

          echo "preview-url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "✅ Preview: $PREVIEW_URL"

      - name: Preview deployment summary
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: |
          {
            echo "## 🌐 Vercel Preview"
            echo
            echo "✅ Preview deployment completed."
            echo "🔗 ${PREVIEW_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    name: ③ Deployments • GitHub Pages
    needs: build-validate
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read

    steps:
      - name: Deploy validated artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ═══════════════════════════════════════════════════════════════════════════════
  # ④ POST-DEPLOYMENT CHECKS
  # Split into two cards to mirror the reference layout.
  # ═══════════════════════════════════════════════════════════════════════════════
  production-health:
    name: ④ Post-Deployment • Production Health
    needs: deploy-production
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Health check with retries
        env:
          URL: ${{ env.PROD_URL }}
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            status="$(curl -L -sS -o /tmp/prod.html -w '%{http_code}' \
              --connect-timeout 10 --max-time 30 "$URL" || true)"

            echo "Attempt $attempt/12 → HTTP $status"

            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "✅ Production health check passed."
              exit 0
            fi

            sleep 10
          done

          echo "::error::Production health check failed after 12 attempts."
          exit 1

      - name: Verify canonical production endpoints
        env:
          URL: ${{ env.PROD_URL }}
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 10 --max-time 30 "${URL}robots.txt" >/dev/null
          curl -fsSL --connect-timeout 10 --max-time 30 "${URL}sitemap.xml" >/dev/null
          echo "✅ robots.txt and sitemap.xml are reachable."

  ssl-smoke:
    name: ④ Post-Deployment • SSL/TLS Smoke Test
    needs: deploy-production
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Verify HTTPS certificate
        env:
          HOST: fahimyusuf.com.bd
        run: |
          set -euo pipefail

          echo | openssl s_client \
            -connect "${HOST}:443" \
            -servername "${HOST}" \
            -verify_return_error \
            2>/tmp/openssl-error.log | \
            openssl x509 -noout -issuer -subject -dates

          echo | openssl s_client \
            -connect "${HOST}:443" \
            -servername "${HOST}" \
            -verify_return_error 2>/dev/null | \
            openssl x509 -checkend 604800 -noout

          echo "✅ TLS certificate is valid for at least 7 more days."

      - name: Verify HTTPS response
        env:
          URL: ${{ env.PROD_URL }}
        run: |
          set -euo pipefail
          headers="$(curl -L -sS -D - -o /dev/null --connect-timeout 10 --max-time 30 "$URL")"
          printf '%s\n' "$headers"
          grep -Eiq '^HTTP/[0-9.]+ 2[0-9][0-9]' <<< "$headers"
          echo "✅ HTTPS smoke test passed."
